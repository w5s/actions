name: CI
on:
  merge_group: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: 🛠️ Setup
        uses: ./setup
      - name: 🔨 Build
        uses: ./task
        with:
          task: build
      - name: 🔍 Validate
        uses: ./task
        with:
          task: validate
