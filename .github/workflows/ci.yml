name: CI
on:
  merge_group: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🛠️ Setup
        uses: ./setup
      - name: 🔨 Build
        uses: ./task
        with:
          task: build
      - name: 🔍 Validate
        uses: ./task
        with:
          task: validate
