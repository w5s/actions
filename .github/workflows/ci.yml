name: CI
on:
  merge_group: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: 🛠️ Setup
        uses: ./setup
      - name: 🔨 Build
        uses: ./task
        with:
          task: build
      - name: 🔍 Validate
        uses: ./task
        with:
          task: validate
