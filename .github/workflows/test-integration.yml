name: Test Integration
on:
  merge_group: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - name: bun
          - name: node
          - name: npm
          - name: python
          - name: pnpm-package-json
          - name: pnpm-tool-versions
          - name: ruby
          - name: yarn
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🧹 Prepare workspace for fixture
        shell: bash
        run: |
          rm -f package.json pnpm-lock.yaml yarn.lock package-lock.json bun.lock bun.lockb uv.lock pyproject.toml requirements.txt setup.py
          cp -R ".github/test-fixtures/${{ matrix.fixture.name }}/." .

      - name: 🛠️ Setup tools
        uses: ./setup-tools
        if: hashFiles('.tool-versions') != ''

      - name: 🛠️ Setup Node package manager
        uses: ./setup-node-package-manager
        if: hashFiles('package.json') != '' || hashFiles('.tool-versions') != ''

      - name: ✅ Run fixture verification script
        shell: bash
        run: bash ./test.sh
