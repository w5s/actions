name: Test Integration
on:
  merge_group: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - name: bun
          - name: node
          - name: npm
          - name: python
          - name: pnpm-package-json
          - name: pnpm-tool-versions
          - name: ruby
          - name: yarn
    # `defaults.run.working-directory` only applies to `run` steps; composite actions
    # read their input files from GITHUB_WORKSPACE unless pointed at the fixture.
    env:
      PACKAGE_JSON_FILE: ${{ github.workspace }}/.github/test-fixtures/${{ matrix.fixture.name }}/package.json
      TOOL_VERSIONS_FILE: ${{ github.workspace }}/.github/test-fixtures/${{ matrix.fixture.name }}/.tool-versions
    defaults:
      run:
        working-directory: .github/test-fixtures/${{ matrix.fixture.name }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🛠️ Setup tools
        uses: ./setup-tools
        if: hashFiles(format('.github/test-fixtures/{0}/.tool-versions', matrix.fixture.name)) != ''

      - name: 🛠️ Setup Node package manager
        uses: ./setup-node-package-manager
        if: >
          hashFiles(format('.github/test-fixtures/{0}/package.json', matrix.fixture.name)) != ''
          || hashFiles(format('.github/test-fixtures/{0}/.tool-versions', matrix.fixture.name)) != ''

      - name: ✅ Run fixture verification script
        shell: bash
        run: bash ./test.sh
