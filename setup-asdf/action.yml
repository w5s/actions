name: 'Setup asdf tools'
description: 'Setup asdf, optionally resolve tool versions, and install tools'
inputs:
  node-version:
    description: 'Node.js version to set with asdf before install; supports major-only (e.g. 24), major.minor (e.g. 24.14), or exact semver (e.g. 24.14.0).'
    required: false
  python-version:
    description: 'Python version to set with asdf before install; supports major-only (e.g. 3), major.minor (e.g. 3.13), or exact semver (e.g. 3.13.1).'
    required: false
  ruby-version:
    description: 'Ruby version to set with asdf before install; supports major-only (e.g. 3), major.minor (e.g. 3.4), or exact semver (e.g. 3.4.1).'
    required: false
outputs:
  resolved-node-version:
    description: 'Exact Node.js version resolved and installed by asdf when node-version input is set.'
    value: ${{ steps.resolve-node-version.outputs.resolved-version }}
  resolved-python-version:
    description: 'Exact Python version resolved and installed by asdf when python-version input is set.'
    value: ${{ steps.resolve-python-version.outputs.resolved-version }}
  resolved-ruby-version:
    description: 'Exact Ruby version resolved and installed by asdf when ruby-version input is set.'
    value: ${{ steps.resolve-ruby-version.outputs.resolved-version }}
runs:
  using: 'composite'
  steps:
    - name: ⚙️ Setup asdf environment
      uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4
      with:
        skip_install: true

    - name: ⚙️ Read asdf environment
      id: asdf-env
      shell: bash
      run: |
        echo "ASDF_DATA_DIR=$ASDF_DATA_DIR" >> "$GITHUB_OUTPUT"
        echo "ASDF_DIR=$ASDF_DIR" >> "$GITHUB_OUTPUT"

    - name: ⚙️ Setup asdf
      uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4

    - name: ⚙️ Set Node version (if node-version is set)
      id: resolve-node-version
      uses: w5s/actions/setup-asdf-tool@main
      with:
        tool: nodejs
        version: ${{ inputs.node-version }}
      if: inputs.node-version != ''

    - name: ⚙️ Set Python version (if python-version is set)
      id: resolve-python-version
      uses: w5s/actions/setup-asdf-tool@main
      with:
        tool: python
        version: ${{ inputs.python-version }}
      if: inputs.python-version != ''

    - name: ⚙️ Set Ruby version (if ruby-version is set)
      id: resolve-ruby-version
      uses: w5s/actions/setup-asdf-tool@main
      with:
        tool: ruby
        version: ${{ inputs.ruby-version }}
      if: inputs.ruby-version != ''

    - name: 📦 Cache asdf
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ steps.asdf-env.outputs.ASDF_DATA_DIR }}
        key: ${{ runner.os }}-${{ runner.arch }}-asdf-${{ hashFiles('.tool-versions') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-asdf-

    - name: ⚙️ Install asdf plugins
      uses: asdf-vm/actions/plugins-add@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4

    - name: ⚙️ Setup requirements for missing plugins
      shell: bash
      env:
        CI_ASDF_NODE_VERSION: ${{ inputs.node-version }}
        CI_ASDF_PYTHON_VERSION: ${{ inputs.python-version }}
        CI_ASDF_RUBY_VERSION: ${{ inputs.ruby-version }}
      run: bash "${{ github.action_path }}/setup-install-requirements.sh"

    - name: ⚙️ Install tools
      shell: bash
      run: asdf install
