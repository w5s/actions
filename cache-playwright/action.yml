name: 'Cache Playwright'
description: 'Cache Playwright browsers'
inputs:
  cache-enabled:
    description: 'Playwright browser cache enabled. If unset, the cache is enabled when package.json exists.'
    required: false
  cache-path:
    description: 'Playwright browser cache directory path'
    required: false
  working-directory:
    description: 'Directory relative to GITHUB_WORKSPACE that contains the project files. Defaults to the workspace root.'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: ⚙️ Configure Playwright cache path
      shell: bash
      run: |
        if [ -n "${{ inputs.cache-path }}" ]; then
          PLAYWRIGHT_BROWSERS_PATH="${{ inputs.cache-path }}"
        else
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
        fi
        echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

    - name: 📦 Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: ${{ runner.os }}-playwright-${{ hashFiles(format('{0}/**/package-lock.json', inputs.working-directory), format('{0}/**/pnpm-lock.yaml', inputs.working-directory), format('{0}/**/yarn.lock', inputs.working-directory), format('{0}/**/bun.lock', inputs.working-directory), format('{0}/**/bun.lockb', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-playwright-
      if: inputs.cache-enabled == 'true' || (inputs.cache-enabled != 'false')
