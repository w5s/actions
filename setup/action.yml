name: 'CI setup'
description: 'Checkout, Turbo cache, asdf/Node, corepack'
inputs:
  bun-cache:
    description: 'Enable or disable Bun cache from github actions cache. When unset, Bun cache runs only if bun.lockb exists.'
    required: false
  github-token:
    description: 'GitHub token for npm auth (e.g. GitHub Packages). When set, configures npm for //npm.pkg.github.com'
    required: false
  node-version:
    description: 'Node.js version to set with asdf (`asdf set nodejs <version>`) before asdf install.'
    required: false
  npm-cache:
    description: 'Enable or disable npm cache from github actions cache. When unset, npm cache runs only if package-lock.json exists.'
    required: false
  pnpm-cache:
    description: 'Enable or disable pnpm cache from github actions cache. When unset, pnpm cache runs only if pnpm-lock.yaml exists.'
    required: false
  nx-cache:
    description: 'Enable or disable Nx cache from github actions cache. When unset, Nx cache runs only if nx.json exists.'
    required: false
  turbo-cache:
    description: 'Enable or disable TurboRepo cache from github actions cache. When unset, Turbo cache runs only if turbo.json exists.'
    required: false
  yarn-cache:
    description: 'Enable or disable Yarn cache from github actions cache. When unset, Yarn cache runs only if yarn.lock exists.'
    required: false
runs:
  using: 'composite'
  steps:
    - name: ⚙️ Setup asdf
      uses: asdf-vm/actions/setup@v4
      if: hashFiles('.tool-versions') != '' || inputs.node-version != ''

    - name: ⚙️ Set Node version with asdf
      shell: bash
      run: asdf set nodejs "${{ inputs.node-version }}"
      if: inputs.node-version != ''

    - name: ⚙️ Install tools
      shell: bash
      run: asdf install
      if: hashFiles('.tool-versions') != '' || inputs.node-version != ''

    # Always restore npm cache
    - uses: w5s/actions/cache-npm@main
      if: inputs.npm-cache == 'true' || (inputs.npm-cache != 'false' && hashFiles('package-lock.json') != '')

    - name: ⚙️ Install Node Package Manager
      shell: bash
      run: |
        package_manager=$(jq -r '.packageManager // empty' package.json)
        if [ -n "$package_manager" ]; then
          # Install corepack if not found
          if ! command -v corepack >/dev/null 2>&1; then
            npm install -g corepack
          fi

          echo "Package manager: $package_manager"
          corepack enable

          if command -v asdf >/dev/null 2>&1; then
            asdf reshim nodejs
          fi
        fi
      if: hashFiles('package.json') != ''

    - uses: w5s/actions/cache-yarn@main
      if: inputs.yarn-cache == 'true' || (inputs.yarn-cache != 'false' && hashFiles('yarn.lock') != '')
    - uses: w5s/actions/cache-pnpm@main
      if: inputs.pnpm-cache == 'true' || (inputs.pnpm-cache != 'false' && hashFiles('pnpm-lock.yaml') != '')
    - uses: w5s/actions/cache-bun@main
      if: inputs.bun-cache == 'true' || (inputs.bun-cache != 'false' && hashFiles('bun.lockb') != '')

    - name: 🔧 Configure npm for GitHub Packages
      shell: bash
      run: npm config set "//npm.pkg.github.com/:_authToken=${{ inputs.github-token }}" --location=user
      if: inputs.github-token != ''

    - name: ⚙️ Setup Turbo cache
      uses: rharkor/caching-for-turbo@a1c4079258ae08389be75b57d4d7a70f23c1c66d # v1.8
      if: inputs.turbo-cache == 'true' || (inputs.turbo-cache != 'false' && hashFiles('turbo.json') != '')

    - name: ⚙️ Setup Nx
      uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      id: nx-set-shas
      with:
        gh-token: ${{ inputs.github-token }}
      if: hashFiles('nx.json') != ''

    # Local Nx cache (when not using Nx Cloud). Key by nx config + HEAD for exact re-runs;
    # restore-keys use base then any OS+config cache so config changes invalidate cache.
    - name: ⚙️ Setup Nx cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
      with:
        path: .nx/cache
        key: nx-cache-${{ runner.os }}-${{ hashFiles('nx.json') }}-${{ steps.nx-set-shas.outputs.head }}
        restore-keys: |
          nx-cache-${{ runner.os }}-${{ hashFiles('nx.json') }}-${{ steps.nx-set-shas.outputs.base }}
          nx-cache-${{ runner.os }}-${{ hashFiles('nx.json') }}-
      if: steps.nx-set-shas.outcome == 'success' && (inputs.nx-cache == 'true' || (inputs.nx-cache != 'false' && hashFiles('nx.json') != ''))

    - name: ℹ️ Package manager information
      shell: bash
      run: |
        if [ -f yarn.lock ]; then
          echo "yarn: $(yarn --version)"
        elif [ -f pnpm-lock.yaml ]; then
          echo "pnpm: $(pnpm --version)"
        elif [ -f package-lock.json ]; then
          echo "npm: $(npm --version)"
        else
          echo 'No lockfile found (yarn.lock, pnpm-lock.yaml, or package-lock.json).'
        fi
      if: hashFiles('package.json') != ''
